[project]
name = "nexus-core"
version = "0.1.0"
description = "NEXUS shared core library — database models, LLM client, economy, KG, review, governance"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "orjson>=3.9",
    "httpx>=0.27",
    "openai>=1.50",
    "tenacity>=9.0",
    "pybreaker>=1.1",
    "networkx>=3.3",
    "numpy>=1.26",
    "asyncpg-listen>=0.0.7",
    "filetype>=1.2.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
