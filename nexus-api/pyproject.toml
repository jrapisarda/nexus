[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS observatory API -- FastAPI backend with WebSocket"
requires-python = ">=3.12"
dependencies = [
    "nexus-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg-listen>=0.0.7",
    "python-multipart>=0.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
nexus-api = "nexus_api.main:run"
