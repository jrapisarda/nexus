services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claudeai
      POSTGRES_PASSWORD: Magic123
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init_extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudeai -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
